# devices/dm1q/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# Samsung has no fastboot: the boot image goes to the `recovery` partition with Odin (tools/mkodin.sh), so the stock
# One UI 8.5 firmware (S911NKSU7FZDT) keeps its boot, init_boot, vendor_boot and super. HakiOS: volume-up + power.

device dm1q
	title       Galaxy S23 (SM-S911N)
	vendor      Samsung
	soc         sm8550
	defconfig   dm1q_defconfig
	maintainer  ssch71
	status      display     partial   UEFI's framebuffer (1080x2340 at 0xb8000000), through the loader: written, not yet seen
	status      touch       missing   not started
	status      buttons     missing   not started (PM8550 PON, not PM7325's)
	status      cpu         partial   8 cores declared (cpus=8 bootcpu=7): written, not yet seen
	status      gpu         missing   Adreno 740: not in hakios-metal's tables
	status      storage     missing   UFS 4.0: UEFI reads it, the kernel's driver is left out
	status      audio       missing   not started
	status      battery     missing   not started
	status      wifi        missing   WCN7851 (ath12k), not the ath11k of the common driver
	status      cellular    missing   not started
